{% extends "base.html" %}

{% block title %}Edit Task | Task Tracker{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
              <h1 class="h3 mb-1">Edit task</h1>
              <p class="text-secondary mb-0">Update the title, description, or status for this task.</p>
            </div>
            <a href="{{ url_for('task_list') }}" class="btn btn-outline-primary">Back</a>
          </div>

          <form method="post">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input
                id="title"
                name="title"
                class="form-control"
                value="{{ task.title }}"
                required
              >
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea
                id="description"
                name="description"
                class="form-control"
                rows="4"
              >{{ task.description }}</textarea>
            </div>

            <div class="mb-4">
              <label for="status" class="form-label">Status</label>
              <select id="status" name="status" class="form-select">
                {% for option in ["Pending", "In Progress", "Completed"] %}
                  <option value="{{ option }}" {% if task.status == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
              </select>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
